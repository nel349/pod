name: ci

on:
  push:
  pull_request:

jobs:
  unit:
    name: unit tests and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      # only the tests that need neither Docker nor a network
      - run: bun test src/__tests__/verdict.test.ts src/__tests__/job.test.ts src/__tests__/receipt.test.ts src/__tests__/gallery.test.ts src/__tests__/jobpage.test.ts src/__tests__/registry.test.ts src/__tests__/server.test.ts src/__tests__/publish.test.ts src/__tests__/runner.test.ts src/__tests__/audit.test.ts src/__tests__/agentpage.test.ts src/__tests__/card.test.ts

  sandbox:
    name: the sealed run, against a real container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # The image is pinned by digest, not by tag, so a run today and a run in October
      # are the same run.
      - run: docker pull node@sha256:9bef0ef1e268f60627da9ba7d7605e8831d5b56ad07487d24d1aa386336d1944
      - run: bun test src/__tests__/sandbox.test.ts src/__tests__/blackbox.test.ts src/__tests__/pipeline.test.ts src/__tests__/endtoend.test.ts src/__tests__/repeat.test.ts

  chain:
    name: the money path, on a real EVM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # the test deploys the bytecode this build produces, onto anvil, and moves real balances
      - run: forge build
        working-directory: contracts
      - run: bun test src/__tests__/chain.test.ts

  contracts:
    name: contract tests
    runs-on: ubuntu-latest
    steps:
      # forge-std is a pinned submodule, and without it the tests do not compile
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge build
        working-directory: contracts
      - run: forge test -vv
        working-directory: contracts
